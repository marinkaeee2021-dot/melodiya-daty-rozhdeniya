<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Как звучит дата рождения?</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: #101e38;
  color: #f7f0df;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
main {
  width: 100%;
  max-width: 650px;
  padding: 36px 25px;
  text-align: center;
  background: #1b2d4b;
  border: 1px solid #b99b61;
  border-radius: 18px;
}
h1 { color: #e6c587; font-size: 32px; }
p { line-height: 1.6; }
input {
  width: 100%;
  max-width: 280px;
  padding: 14px;
  font-size: 20px;
  text-align: center;
  border-radius: 9px;
  border: 1px solid #d7c5a3;
}
button {
  display: block;
  margin: 20px auto;
  padding: 14px 28px;
  background: #e6c587;
  color: #101e38;
  border: none;
  border-radius: 9px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}
#result { margin-top: 25px; }
.notes {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-top: 18px;
}
.note {
  min-width: 58px;
  padding: 12px 7px;
  background: #f7f0df;
  color: #101e38;
  border-radius: 8px;
}
.digit { font-size: 13px; color: #74664d; }
.sound { font-size: 18px; font-weight: bold; }
footer { margin-top: 35px; font-size: 13px; color: #c7bda9; }
</style>
</head>
<body>
<main>
  <div style="font-size:42px">♫</div>
  <h1>Как звучит дата рождения?</h1>
  <p>Введи дату рождения и узнай, какие музыкальные
  ноты скрываются в её цифрах!</p>

  <input id="birthday" placeholder="ДД.ММ.ГГГГ"
    oninput="let d=this.value.replace(/\D/g,'').slice(0,8);this.value=d.slice(0,2)+(d.length>2?'.'+d.slice(2,4):'')+(d.length>4?'.'+d.slice(4):'');"
         maxlength="10" inputmode="text">
  <button onclick="calculate()">Узнать мелодию</button>

  <div id="result" aria-live="polite"></div>

  <button id="playButton" onclick="playMelody()" style="display:none">
  ▶ Прослушать мелодию
</button>

  <footer>
    Исследовательский проект Дмитрия Пузырева
  </footer>
</main>

<script>
function calculate() {
  document.getElementById("playButton").style.display = "none";
  const value = document.getElementById("birthday").value.trim();
  const result = document.getElementById("result");

  if (!/^\d{2}\.\d{2}\.\d{4}$/.test(value)) {
    result.textContent = "Введи дату в формате ДД.ММ.ГГГГ";
    return;
  }

  const [day, month, year] = value.split(".").map(Number);
  const date = new Date(year, month - 1, day);

  if (year < 100 || date.getFullYear() !== year ||
      date.getMonth() !== month - 1 ||
      date.getDate() !== day) {
    result.textContent = "Проверь дату рождения";
    return;
  }

  const mapping = {
    "1":"до", "2":"ре", "3":"ми", "4":"фа",
    "5":"соль", "6":"ля", "7":"си",
    "8":"до", "9":"ре", "0":"ми"
  };

  const digits = value.replace(/\./g, "");
  const notes = [...digits].map(digit => mapping[digit]);

  result.innerHTML =
    "<p>Твоя дата рождения звучит так:</p>" +
    '<div class="notes">' +
    [...digits].map((digit, i) =>
      '<div class="note"><div class="digit">' + digit +
      '</div><div class="sound">' + notes[i] +
      '</div></div>'
    ).join("") +
    "</div>";
  document.getElementById("playButton").style.display = "inline-block";
}
let audioContext;
let isPlaying = false;

async function playMelody() {
  if (isPlaying) return;

  const value = document.getElementById("birthday").value;
  const digits = value.replace(/\D/g, "");

  if (digits.length !== 8) return;

  const frequencies = {
    "1": 261.63, // до
    "2": 293.66, // ре
    "3": 329.63, // ми
    "4": 349.23, // фа
    "5": 392.00, // соль
    "6": 440.00, // ля
    "7": 493.88, // си
    "8": 261.63, // до
    "9": 293.66, // ре
    "0": 329.63  // ми
  };

  if (!audioContext) {
  audioContext = new (window.AudioContext || window.webkitAudioContext)();
}

audioContext.resume();

  isPlaying = true;
  const button = document.getElementById("playButton");
  button.disabled = true;

  const start = audioContext.currentTime + 0.05;

  [...digits].forEach((digit, i) => {
    const oscillator = audioContext.createOscillator();
    const volume = audioContext.createGain();

    oscillator.type = "triangle";
    oscillator.frequency.value = frequencies[digit];

    oscillator.connect(volume);
    volume.connect(audioContext.destination);

    const time = start + i * 0.45 + (i % 2 ? 0.08 : 0);

    volume.gain.setValueAtTime(0, time);
    volume.gain.linearRampToValueAtTime(0.25, time + 0.02);
    volume.gain.setValueAtTime(0.25, time + 0.32);
    volume.gain.linearRampToValueAtTime(0, time + 0.4);

    oscillator.start(time);
    oscillator.stop(time + 0.41);
  });

  setTimeout(() => {
    isPlaying = false;
    button.disabled = false;
  }, 3700);
}

</script>
</body>
</html>
